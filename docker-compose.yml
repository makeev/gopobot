services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - gopobot_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        # `any`, not `on-failure` (2026-07-27): on a graceful node restart redis
        # exits 0, and with `on-failure` swarm treats that as "nothing to do" —
        # no replacement task is ever scheduled. That is exactly how a 9-second
        # manager reboot on 2026-07-26 left this service down for 13 hours.
        condition: any
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  gopobot:
    image: ${GOPOBOT_IMAGE:-mmakeev/gopobot:latest}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - TOKEN=${TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ADMIN_USERS=${ADMIN_USERS}
      - REDIS_URL=redis://redis:6379
      - LIMIT_TIME=${LIMIT_TIME:-86400}
      - LIMIT_MESSAGES=${LIMIT_MESSAGES:-20}
      - TEXT_REQUEST_COST=${TEXT_REQUEST_COST:-1}
      - IMAGE_REQUEST_COST=${IMAGE_REQUEST_COST:-5}
      - PHOTO_REQUEST_COST=${PHOTO_REQUEST_COST:-2}
      - VOICE_REQUEST_COST=${VOICE_REQUEST_COST:-2}
      - CHAT_MODEL=${CHAT_MODEL:-gpt-5.6-luna}
      - IMAGE_MODEL=${IMAGE_MODEL:-gpt-image-2}
      - TRANSCRIPTION_MODEL=${TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
      - OPENAI_TIMEOUT=${OPENAI_TIMEOUT:-120}
      - OPENAI_MAX_RETRIES=${OPENAI_MAX_RETRIES:-2}
      - MAX_OUTPUT_TOKENS=${MAX_OUTPUT_TOKENS:-1200}
      - SYSTEM_PROMPT=${SYSTEM_PROMPT:-}
      - MAX_HISTORY_MESSAGES=${MAX_HISTORY_MESSAGES:-100}
      - HISTORY_CONTEXT_MESSAGES=${HISTORY_CONTEXT_MESSAGES:-20}
      - HISTORY_SUMMARY_TRIGGER=${HISTORY_SUMMARY_TRIGGER:-30}
      - HISTORY_TTL=${HISTORY_TTL:-2592000}
      - GROUP_MODE=${GROUP_MODE:-mentions}
      - LOG_USER_CONTENT=${LOG_USER_CONTENT:-false}
      - LOCATION_RADIUS_KM=${LOCATION_RADIUS_KM:-3}
      - LOCATION_WEB_SEARCH=${LOCATION_WEB_SEARCH:-true}
    depends_on:
      - redis
    networks:
      - gopobot_network
    deploy:
      replicas: 1
      restart_policy:
        # `any` for the same reason as redis above.
        condition: any
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        # Telegram long polling допускает только одного активного получателя
        # обновлений с одним токеном.
        order: stop-first
    stop_grace_period: 30s

networks:
  gopobot_network:
    driver: overlay
    attachable: true

volumes:
  redis_data:
    driver: local
