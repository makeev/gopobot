name: CI

on:
  push:
  pull_request:

env:
  TOKEN: 123456:test-token
  OPENAI_API_KEY: sk-test
  ADMIN_USERS: ""
  REDIS_URL: redis://localhost:6379/15

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest
      - run: docker build .
